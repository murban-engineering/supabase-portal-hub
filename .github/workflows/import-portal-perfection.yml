name: Import portal-perfection

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace destination contents with source repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          workdir="$(mktemp -d)"
          git clone --depth 1 https://github.com/murban-engineering/portal-perfection.git "$workdir/source"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude='.git' "$workdir/source/" ./

          git add -A
          if git diff --cached --quiet; then
            echo "Destination already matches source."
            exit 0
          fi

          git commit -m "Replace contents with portal-perfection"
          git push
